name: Other bug
description: Building, audio, controls, movies, saves, performance or game logic.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the pinned issues first.

        Do not attach or link game files, keys, firmware, builds, shader caches or screenshots of the game. Issues that do are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the pinned issues and [searched open and closed issues](https://github.com/Lucas-blip-png/dkb-pc-recomp/issues?q=is%3Aissue) for this bug.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Building from source
        - Audio
        - Controls and input
        - Movies
        - Saves
        - Performance and stutter
        - Game logic
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: The release you downloaded (for example 0.3.0), or the commit you built, from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options:
        - "1.0.0 (base)"
        - "3.2.0 (update 458752)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and operating system
      description: For example "GeForce RTX 4070, 591.44, Windows 11 24H2" or "Radeon RX 6600, Mesa 25.2, Arch Linux".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
      description: For a build problem, paste the command and the last lines of its output.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach logs/dkb.log from the folder of dkb.exe (or the dkb binary on Linux). Copy it before you start the game again, because the next start renames it to dkb.1.log. Say if you changed dkb.ini, and paste the changed lines.
