name: Crash
description: The game closes, freezes, shows a FATAL message or loses the GPU.
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        A good crash report shows where the next problem is.
        Check the pinned issues first, and see [docs/dkb-testing.md](https://github.com/Lucas-blip-png/dkb-pc-recomp/blob/bananza/docs/dkb-testing.md) for how to run and where the log is.

        Do not attach or link game files, keys, firmware, builds, shader caches or screenshots of the game. Issues that do are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the pinned issues and [searched open and closed issues](https://github.com/Lucas-blip-png/dkb-pc-recomp/issues?q=is%3Aissue) for this crash.
          required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: The release you downloaded (for example 0.3.0), or the commit you built, from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options:
        - "1.0.0 (base)"
        - "3.2.0 (update 458752)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and operating system
      description: For example "GeForce RTX 4070, 591.44, Windows 11 24H2" or "Radeon RX 6600, Mesa 25.2, Arch Linux".
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When does it crash?
      options:
        - At startup, before any picture
        - Before or on the title screen
        - In the first level
        - While loading or changing layer
        - During or right after a movie
        - Further into the game (say the layer below)
    validations:
      required: true
  - type: dropdown
    id: repeat
    attributes:
      label: Does it happen every time?
      options:
        - "Yes, at the same point every run"
        - "Sometimes"
        - "Only once so far"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did before the crash
      description: The layer or area, fresh profile or an existing save, keyboard or controller, and how long you had played.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach logs/dkb.log from the folder of dkb.exe (or the dkb binary on Linux). Copy it before you start the game again, because the next start renames it to dkb.1.log. Say if you changed dkb.ini, and paste the changed lines.
    validations:
      required: true
